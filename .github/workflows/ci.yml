name: Java CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devopsimage
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # 3. Maven Build + Test
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Maven Build and Test
        run: ./mvnw clean package


      # 4. Docker Build
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .


      # 5. AWS OIDC Authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::679609137686:role/GitHubActionsECRRole


      # 6. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # 7. ECR Login
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # 8. Docker Tag
      - name: Tag Docker image
        run: |
          docker tag \
            ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


      # 9. Docker Push
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}