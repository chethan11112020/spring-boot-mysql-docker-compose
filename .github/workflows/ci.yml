name: Java CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Maven Build and Unit Test
        run: ./mvnw clean package

      - name: Docker Build
        run: docker build -t spring-boot-app:${{ github.sha }} .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
            image-ref: spring-boot-app:${{ github.sha }}
            format: table
            exit-code: '1'
            ignore-unfixed: true
            severity: CRITICAL,HIGH

      